# Stamp the build into the site on every push to main.
#
# The complaint this answers: "how will I know my site has been updated?" The
# version shown in the footer changes with every commit, and the page checks
# this file on load, so a stale cached copy can no longer masquerade as the
# current site.
#
# The push is made with the default GITHUB_TOKEN, so it does not re-trigger
# workflows; the guard below is belt and braces.
name: version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Write the build stamp
        run: |
          SHORT=$(git rev-parse --short HEAD)
          VERSION=$(node -p "require('./package.json').version")
          BUILT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          printf '{\n  "version": "%s",\n  "commit": "%s",\n  "built": "%s"\n}\n' \
            "$VERSION" "$SHORT" "$BUILT" > assets/version.json
          echo "stamped $VERSION+$SHORT at $BUILT"

      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/version.json; then
            echo "already current"; exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/version.json
          git commit -m "chore: stamp build $(node -p "require('./package.json').version")+$(git rev-parse --short HEAD)"
          git push
