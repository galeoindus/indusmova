# Stamp the build into the site on every push to main.
#
# The complaint this answers: "how will I know my site has been updated?" The
# version shown in the footer changes with every commit, and the page checks
# this file on load, so a stale cached copy can no longer masquerade as the
# current site.
#
# The push is made with the default GITHUB_TOKEN, so it does not re-trigger
# workflows; the guard below is belt and braces.
name: version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Stamp every page and asset URL
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: npm run stamp:build

      - name: Commit if the build stamp changed
        run: |
          git add -- '*.html' assets/js/config.js assets/version.json
          if git diff --cached --quiet; then
            echo "already current"; exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: stamp build $(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)"
          git push
