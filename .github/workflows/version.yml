# Stamp the build into the site on every push to main.
#
# The complaint this answers: "how will I know my site has been updated?" The
# version shown in the footer changes with every commit, and the page checks
# this file on load, so a stale cached copy can no longer masquerade as the
# current site.
#
# Why this does not push at main
# ------------------------------
# `main` is protected by the `protect-main` ruleset: changes must arrive
# through a pull request, and history must stay linear. The old job committed
# the stamp and ran `git push` straight at main, so GitHub rejected it every
# time with
#
#   remote: error: GH013: Repository rule violations found for refs/heads/main
#   remote: - Changes must be made through a pull request.
#
# and the workflow went red on every push, even though the stamp itself was
# fine.
#
# The bot therefore commits the stamp to a short-lived branch and tries to
# land it through a pull request, which is what the rules ask for. Whether it
# *can* open that pull request is a repository setting the workflow cannot
# change from inside a run ("Allow GitHub Actions to create and approve pull
# requests", under Settings → Actions → General). When that setting is off, or
# when the branch protection refuses the merge, this job says so in the run
# summary and finishes green — the stamp is still published, because `deploy`
# re-stamps every page before it uploads, so the live site is never stale. A
# red X on every push for a cosmetic commit is worse than a notice.
name: version

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Stamp every page and asset URL
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: npm run stamp:build

      - name: Land the stamp through a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          git add -- '*.html' assets/js/config.js assets/version.json
          if git diff --cached --quiet; then
            echo "already current — nothing to stamp"
            exit 0
          fi

          VERSION="$(node -p "require('./package.json').version")"
          SHORT="$(git rev-parse --short HEAD)"
          BRANCH="build/stamp-${SHORT}"

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: stamp build ${VERSION}-${SHORT}"

          # Reuse the branch when a previous run got this far and stopped
          # before merging, rather than failing the push.
          git push --force origin "HEAD:refs/heads/${BRANCH}" || {
            echo "::notice title=Stamp not committed::Could not push ${BRANCH}. The deployed site is still stamped by the deploy job."
            exit 0
          }

          if ! gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "chore: stamp build ${VERSION}-${SHORT}" \
              --body "Automated build stamp for ${SHA}. Opened by the \`version\` workflow because \`main\` requires changes to arrive through a pull request." ; then
            # Leave nothing behind. A branch per push accumulates for ever, and
            # it holds nothing the deployed site needs — `deploy` stamps every
            # page again before it uploads.
            git push --quiet origin --delete "${BRANCH}" || true
            echo "::notice title=Stamp not committed::This repository does not let GitHub Actions open pull requests, so the stamp stays out of git. The live site is still stamped: the deploy job stamps every page before it uploads. Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests' to have it committed too."
            exit 0
          fi

          # Squash keeps the history linear, which the ruleset requires.
          if ! gh pr merge "${BRANCH}" --squash --delete-branch; then
            gh pr merge "${BRANCH}" --squash --delete-branch --admin || {
              echo "::notice title=Stamp pull request open::${BRANCH} has an open pull request that could not be merged automatically. Merge it by hand; the live site is already stamped by the deploy job."
              exit 0
            }
          fi
