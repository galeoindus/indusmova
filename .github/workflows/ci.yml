# Checks and tests on every push and pull request.
#
# The audit's F-11 was that nothing verified the code. `npm run verify` parses
# every module, checks that every import resolves, and runs the unit tests —
# including the three that pin the routing bug the audit found.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      # The tests import jsdom, and the job never installed it — so `verify`
      # died with ERR_MODULE_NOT_FOUND before a single assertion ran. The
      # dependency step was simply missing.
      - name: Install dependencies
        run: npm ci
      - name: Stamp every page and verify the repository
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: npm run stamp:build && npm run verify
