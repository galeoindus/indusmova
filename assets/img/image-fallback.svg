<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Image unavailable</title>
  <desc id="desc">A neutral placeholder shown when an external article image cannot be loaded.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9eee8"/>
      <stop offset="1" stop-color="#d7e1d9"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245b4c"/>
      <stop offset="1" stop-color="#b8754b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="116" fill="#fff" fill-opacity=".6"/>
  <rect x="524" y="244" width="152" height="124" rx="18" fill="none" stroke="url(#mark)" stroke-width="12"/>
  <circle cx="574" cy="282" r="12" fill="#b8754b"/>
  <path d="m538 347 42-43 27 26 22-20 34 37" fill="none" stroke="#245b4c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="505" fill="#29483d" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="600" text-anchor="middle">Image temporarily unavailable</text>
  <text x="600" y="548" fill="#557066" font-family="Inter,Arial,sans-serif" font-size="20" text-anchor="middle">The original Wikimedia image could not be reached</text>
</svg>
