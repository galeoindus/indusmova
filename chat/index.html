<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta name="indusmova-build" content="5.10.0-9a242f6">
  <meta name="indusmova-version" content="5.10.0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ask — indusmova</title>
  <meta name="description" content="Ask a question and get a clear answer broken into topics, with the sources behind every claim.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://indusmova.pages.dev/chat/">
  <meta name="theme-color" content="#0d1411" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="light dark">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="indusmova">
  <meta property="og:title" content="Ask — indusmova">
  <meta property="og:description" content="A clear answer broken into topics, with the sources behind every claim.">
  <meta property="og:url" content="https://indusmova.pages.dev/chat/">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&amp;family=Lora:ital,wght@0,500;0,600&amp;display=swap">
  <link rel="stylesheet" href="/assets/css/chat-page.css?v=5.10.0-9a242f6">
</head>
<body class="is-empty">
  <a class="skip-link" href="#prompt">Skip to the question box</a>

  <header class="bar">
    <a class="brand" href="/" aria-label="indusmova home">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.6a8.4 8.4 0 0 1-9 8.4 9.2 9.2 0 0 1-3.4-.7L3 21l1.6-4.6A8.2 8.2 0 0 1 3.6 11 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.6Z"/></svg>
      </span>
      <b>indusmova</b>
    </a>
    <div class="bar-right">
      <button id="savedAnswersBtn" type="button" class="ghost">Saved</button>
      <button id="newChat" type="button" class="ghost">New chat</button>
      <button id="themeBtn" type="button" class="icon" aria-label="Switch theme" title="Light / dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9c0-.5-.4-.9-.9-.9a7 7 0 0 1-7.2-7.2c0-.5-.4-.9-.9-.9z"/></svg>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="stage">
      <div class="empty" id="empty">
        <h1>What do you want to <em>understand</em>?</h1>
        <p>Ask in your own words. You get a clear answer, broken into topics, with the sources behind every claim.</p>
        <div class="chips" id="suggestions"></div>
      </div>
      <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation"></div>
    </div>
  </main>

  <div class="dock" id="dock">
    <div class="dock-inner">
      <p class="offline" id="offline" role="status" hidden>You are offline. Answers need a connection.</p>
      <form class="composer" id="composer" autocomplete="off" action="javascript:void(0)" novalidate>
        <label class="sr-only" for="prompt">Ask a question</label>
        <textarea id="prompt" rows="1" maxlength="800" placeholder="Ask anything…" spellcheck="true"></textarea>
        <button class="stop" id="stopBtn" type="button" hidden aria-label="Stop">Stop</button>
        <button class="send" id="send" type="button" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 20 4l-4.5 16-4-6.5L4 12Z"/></svg>
        </button>
      </form>
      <div class="tools">
        <label class="sr-only" for="contentLanguage">Source language</label>
        <select id="contentLanguage" aria-label="Source language">
          <option value="en">English</option><option value="hi">हिन्दी</option><option value="bn">বাংলা</option>
          <option value="ta">தமிழ்</option><option value="te">తెలుగు</option><option value="mr">मराठी</option>
          <option value="gu">ગુજરાતી</option><option value="kn">ಕನ್ನಡ</option><option value="ml">മലയാളം</option>
          <option value="pa">ਪੰਜਾਬੀ</option><option value="ur">اردو</option><option value="sa">संस्कृतम्</option>
        </select>
        <label class="sr-only" for="answerDepth">Answer depth</label>
        <select id="answerDepth" aria-label="Answer depth">
          <option value="quick">Quick</option>
          <option value="detailed" selected>Detailed</option>
          <option value="deep">Deep</option>
        </select>
        <label class="sr-only" for="uiLanguage">Interface language</label>
        <select id="uiLanguage" aria-label="Interface language">
          <option value="en">EN</option><option value="hi">हिं</option>
        </select>
        <button id="voiceBtn" type="button" class="ghost" hidden>Voice</button>
        <span class="hint" id="privacyHint">Answers are written from the sources shown under them.</span>
      </div>
    </div>
  </div>

  <noscript>
    <div class="dock"><div class="dock-inner"><p class="hint">The chat needs JavaScript. You can still read the entries at <a href="/articles/">the library</a>.</p></div></div>
  </noscript>

  <script type="module" src="/assets/js/build-watch.js?v=5.10.0-9a242f6"></script>
  <script type="module" src="/assets/js/chat-page.js?v=5.10.0-9a242f6"></script>
</body>
</html>
